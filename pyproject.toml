[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tem-design-simulation"
version = "0.1.0"
description = "TEM Design & Simulation — An Interactive TEM/STEM Platform for Education and Research"
readme = "README.md"
license = "GPL-3.0-only"
license-files = [
    "LICENSE",
    "COPYRIGHT",
    "licenses/legacy-MIT.txt",
    "THIRD_PARTY_NOTICES.md",
    "third_party_licenses/README.md",
    "third_party_licenses/inventory.json",
    "third_party_licenses/supplements.json",
    "third_party_licenses/packages/**/*.txt",
    "third_party_licenses/upstream/*.txt",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "abtem==1.0.10",
    "ase>=3.29,<4",
    "cloudpickle>=3.1,<4",
    "imageio>=2.37,<3",
    "matplotlib",
    "manifold3d>=3.5.1,<4",
    "numba",
    "numpy",
    "pyqtgraph",
    "PyOpenGL>=3.1.7,<4",
    "pillow>=11,<13",
    "PySide6==6.8.3",
    "scipy",
    "threadpoolctl>=3.6,<4",
    "tomli-w",
    "tifffile>=2025,<2027",
    "xraylib==4.3.0",
]

[project.optional-dependencies]
dev = [
    "mpmath>=1.3,<2",
    "pytest",
    "pytest-qt",
]
gpu = [
    "cupy-cuda12x>=14,<15",
]
atomistic = []
benchmark = ["psutil>=7,<8"]

[project.urls]
Homepage = "https://github.com/MagNetiCLLLL/TEM-Design-and-Simulation"
Repository = "https://github.com/MagNetiCLLLL/TEM-Design-and-Simulation"
Issues = "https://github.com/MagNetiCLLLL/TEM-Design-and-Simulation/issues"

[project.scripts]
tem-design-simulation = "temsim.app:run"
tem-design-simulation-recorder = "temsim.recorder.__main__:run"
tem-design-simulation-experiment = "temsim.experiment_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.cmdclass]
bdist_wheel = "temsim._build.FreshWheel"

[tool.setuptools.package-data]
"temsim.gui" = ["assets/*.svg"]
"temsim.recorder" = ["autoscript_1_18.json"]

[tool.setuptools.data-files]
"." = ["requirements-cad.txt"]
"configs/environments" = ["configs/environments/*.toml"]
"configs/sources" = ["configs/sources/*.toml"]
"configs/subassemblies" = ["configs/subassemblies/*.toml"]
"configs/instruments" = ["configs/instruments/catalog.toml"]
"configs/instruments/column" = ["configs/instruments/column/*.toml"]
"configs/instruments/gun" = ["configs/instruments/gun/*.toml"]
"configs/instruments/beam_blanker" = ["configs/instruments/beam_blanker/*.toml"]
"configs/instruments/project_and_recording_system" = [
    "configs/instruments/project_and_recording_system/*.toml",
]
"configs/detectors/eds" = ["configs/detectors/eds/*.toml"]
"configs/physics/eds" = ["configs/physics/eds/*.json"]
"configs/specimens" = ["configs/specimens/*.toml"]
"configs/specimen_supports" = ["configs/specimen_supports/*.toml"]
"configs/operating_modes" = ["configs/operating_modes/*.toml"]
"configs/materials" = ["configs/materials/lens_defaults.toml"]
"configs/materials/magnetic" = ["configs/materials/magnetic/*.toml"]

[tool.pytest.ini_options]
# Zarr's dependency plugin imports optional GPU libraries during collection.
# These tests do not use its fixtures; the acceptance runner also loads only
# the project's evidence plugin and pytest-qt explicitly.
addopts = "-q -p no:zarr"
testpaths = ["tests"]

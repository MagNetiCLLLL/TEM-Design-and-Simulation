format_version = 1
description = "Calculated reference Microprobe/Nanoprobe and Image/Diffraction operating states."
# A calibrated default must not remain at 100% excitation. If a solver reaches
# saturation, increase that lens's maximum field and rebase the stored default
# into 30-70% while preserving maximum_field * percent / 100.
# field_polarity is the effective signed Bz direction in the source-to-detector
# +z coordinate. It is independent of the non-negative excitation percentage.

[mini_condenser_control]
schema = "signed_equal_magnitude_v1"
# Unretuned assemblies retain their historical startup magnitude. Installation
# chooses one value; mode changes preserve that live value and reverse its sign.
default_excitation_percent = 10.0
control_convention = "Microprobe positive; Nanoprobe negative; equal magnitude. Optical off never means zero current. OEM channel mapping remains uncalibrated."

[mini_condenser_control.column_startup_excitation_percent]
# Both default probe modes were checked only for this column's relay geometry.
"column/C3_ProbeCorrector.toml" = 43.88646617222637


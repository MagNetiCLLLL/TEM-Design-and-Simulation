# Reusable mechanical module exported from the current TEM assembly.
# All coordinates are local to this module, not source-absolute.
# Positive z follows the electron-beam direction.

format_version = 1
coordinate_system = "module_local_z_mm"

[module]
type = "column"
key = "column:c3_probecorrector_bcor"
name = "C3 + Probe Corrector + B-COR"
c3_lens = true
probe_corrector = true
image_corrector = true
image_corrector_design = "bcor"
corrector_qualification = "engineering_topology_only_not_aberration_qualified"

[ports.entrance]
interface = "gun_to_column"
local_z_mm = 0.0

[ports.exit]
interface = "column_to_project_and_recording_system"
local_z_mm = 1934.4

[geometry]
# CEOS lists H x W x D. These are device-envelope references, not lens spacings.
probe_corrector_reference_product = "CEOS CESCOR"
probe_corrector_reference_dimensions_hwd_mm = [255.0, 337.0, 255.0]
probe_corrector_reference_dimensions_source = "https://www.ceos-gmbh.de/de/produkte/stemkorrektoren/cescor"
probe_corrector_reference_dimensions_status = "published_outer_dimensions; internal and flange boundaries unreported"

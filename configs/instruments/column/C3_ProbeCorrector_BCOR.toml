probe_corrector_length_comparison_note = "Core HP2-TL22-TL21-HP1, coupled ADL-to-TL1 optics, and upstream alignment have different boundaries. The published 255 mm body height is not a confirmed ADL-to-TL1 or flange spacing. No optical coordinates are scaled from the schematic."

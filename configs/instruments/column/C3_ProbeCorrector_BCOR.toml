c1_c2_objective_vacuum_tube_inner_diameter_mm = 5.76
c1_c2_objective_vacuum_tube_outer_diameter_mm = 19.2
c1_c2_objective_vacuum_tube_inner_to_outer_ratio = 0.30
c1_c2_objective_vacuum_tube_outer_to_objective_pole_ratio = 0.20
c1_c2_objective_vacuum_tube_seal_material = "iridium_metal_user_identified_unverified"
c1_c2_objective_vacuum_tube_geometry_status = "engineering_reconstruction_not_oem"
c1_c2_objective_vacuum_tube_geometry_source = "User-supplied C1/C2 cartridge and Objective pole-piece photographs. The 60.0 mm cartridge ID is approximately 0.66 of its retained 90.75 mm OD; the 19.2 mm tube/Objective connector OD is 0.20 of the retained 96.0 mm Objective pole OD; the tube ID is user-directed at 30% of its OD. The metal vacuum seal was identified by the user as iridium but is not independently verified. Photo-scaled dimensions are engineering reconstruction values, not OEM measurements."


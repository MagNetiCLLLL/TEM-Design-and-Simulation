mechanical_material_tube_status = "engineering_reconstruction_not_oem"
mechanical_material_tube_source = "Engineering assembly clearance reconstruction, not an OEM measurement: retain the configured 5.76 mm beam ID and 19.2 mm maximum material OD; reduce OD to 17.2 mm over C3 poles with 10 mm axial transitions and 0.4 mm radial clearance in the existing 18 mm bore; provide only the declared strip apertures with side-entry slots following their existing plate geometry and rigid pose, with 0.2 mm clearance per side. These material details do not replace the axisymmetric electric boundary."

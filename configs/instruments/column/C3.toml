magnetic_lens_coil_axial_fraction = 0.9
magnetic_lens_coil_radial_thickness_base_mm = 6.0
magnetic_lens_coil_radial_thickness_per_t_mm = 3.0
magnetic_lens_geometry_status = "engineering_reconstruction_not_oem"
magnetic_lens_geometry_source = "User-directed constant-OD TEM-column reconstruction. The user-directed C1/C2 split is 100/200 mm inside the retained 300 mm cartridge. The provisional C1/C2 field half-widths scale from the preceding 140/160 mm envelopes and the maximum fields conserve B0^2*a, hence the isolated integral of Bz^2, at fixed excitation. Public column literature and magnetic-lens patent US20150021476A1 support topology and relative design only; dimensions and field calibration are simulator engineering assumptions, not OEM measurements."

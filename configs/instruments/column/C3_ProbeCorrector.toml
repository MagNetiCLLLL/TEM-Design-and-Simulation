multipole_winding_source_note = "Explicit 2026-11-15 ideal-vacuum multipole engineering initialization. Per-coil N=2; count method fixed_physical_probe_HP_or_fine_wire_limiting_pack_v1. Metal area 0.02 mm2, radial enamel assumption 0.005 mm. Auxiliary nominal metal fill 0.60; fixed original Probe HP N and Image HP nominal 9 mm2 pack allocation are separate count references. Large residual insulation does not establish a manufacturing design or current rating. Saved mechanical winding angular datum 27.59286713706764 degrees; unchanged native optical orientation -0.04201239399112702 rad. The primary six-coil datum defines its previously uncalibrated CAD/electrical phase; it is shared by winding and passive cartridge CAD and does not edit an optical drive, installation-error input or clipping boundary. Explicit engineering ideal-vacuum corrector winding reconstruction, not OEM or measured winding data. Closed radial circuits preserve their fixed allocated envelope, turns and current support. Existing optical controls and transport boundaries remain authoritative. Auxiliary winding CAD adds no opaque cartridge. Magnetic cores, pole pieces, permeability, leads, resistance, heating and current ratings are excluded from the field model."

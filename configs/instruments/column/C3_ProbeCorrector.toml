# Reusable mechanical module exported from the current TEM assembly.
# All coordinates are local to this module, not source-absolute.
# Positive z follows the electron-beam direction.

format_version = 1
coordinate_system = "module_local_z_mm"

[module]
type = "column"
key = "column:c3_probecorrector"
name = "C3 + Probe Corrector"
c3_lens = true
probe_corrector = true
image_corrector = false

[ports.entrance]
interface = "gun_to_column"
local_z_mm = 0.0

[ports.exit]
interface = "column_to_project_and_recording_system"
local_z_mm = 1364.4

[geometry]
# CEOS lists H x W x D. These are device-envelope references, not lens spacings.

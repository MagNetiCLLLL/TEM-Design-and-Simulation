# Rear hardware: axisymmetric normal-emission adaptation of FEI Fig. 5.
# The patent specifies ~1.5 mm protrusion and 1.8-2.2 mm facing gap only.
# Other dimensions and the normal-emission EEE wiring below are assumptions.
# Negative Z is behind the tip; the source reference remains exactly Z=0.
[[parts]]
order = 100
key = "feg_emitter_enclosure"
name = "Emitter Enclosure Electrode (EEE)"
branch = "common"
mechanical_only = true
rear_gun_role = "emitter_enclosure_electrode"
local_start_z_mm = -1.8
local_center_z_mm = -1.65
optical_reference_local_z_mm = -1.65
local_end_z_mm = -1.5
length_mm = 0.3
vacuum_inner_diameter_mm = 0.6
bore_diameter_mm = 0.6
outer_diameter_mm = 20.0
rear_voltage_reference = "tip"
rear_bias_kv = 0.0
parameter_metadata.local_end_z_mm = { source_kind = "documented", source_note = "US8736170B1 Fig. 5: approximately 1.5 mm needle protrusion ahead of EEE." }
parameter_metadata.bore_diameter_mm = { source_kind = "estimated", source_note = "Engineering clearance around the configured tip shank; not an FEI dimension." }
parameter_metadata.length_mm = { source_kind = "estimated", source_note = "Engineering electrode thickness; not specified by the patent." }
parameter_metadata.outer_diameter_mm = { source_kind = "estimated", source_note = "Axisymmetric engineering envelope; not an FEI dimension." }
parameter_metadata.rear_voltage_reference = { source_kind = "estimated", source_note = "Assumed normal-emission tip connection. Patent cleaning biases do not establish normal-emission EEE wiring." }

